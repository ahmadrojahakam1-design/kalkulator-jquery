<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Kalkulator jQuery</title>
</head>

<style>
    table { width: 240px; }
    button { width: 100%; height: 40px; font-size: 18px; }
</style>

<body>

    <h1 id="nama"></h1>
    <p id="nim"></p>

    <h2 id="layar">0</h2>

    <table>
        <tr>
            <td><button class="angka">7</button></td>
            <td><button class="angka">8</button></td>
            <td><button class="angka">9</button></td>
            <td><button class="operator" data-op="/">&divide;</button></td>
        </tr>
        <tr>
            <td><button class="angka">4</button></td>
            <td><button class="angka">5</button></td>
            <td><button class="angka">6</button></td>
            <td><button class="operator" data-op="*">&times;</button></td>
        </tr>
        <tr>
            <td><button class="angka">1</button></td>
            <td><button class="angka">2</button></td>
            <td><button class="angka">3</button></td>
            <td><button class="operator" data-op="-">&minus;</button></td>
        </tr>
        <tr>
            <td><button class="angka">0</button></td>
            <td><button id="titik">.</button></td>
            <td><button id="hapus">C</button></td>
            <td><button class="operator" data-op="+">+</button></td>
        </tr>
        <tr>
            <td colspan="4"><button id="sama">=</button></td>
        </tr>
    </table>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="script.js"></script>

</body>
</html>
